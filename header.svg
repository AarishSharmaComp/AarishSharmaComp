<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Aarish Sharma, Java full-stack developer learning DevOps">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131c3a"/></linearGradient>
  <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="460" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="8s" repeatCount="indefinite"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <clipPath id="card"><rect width="1000" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>
  <circle r="260" fill="url(#g1)"><animate attributeName="cx" values="820;900;820" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;110;40" dur="14s" repeatCount="indefinite"/></circle>
  <circle r="240" fill="url(#g2)"><animate attributeName="cx" values="120;40;120" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="300;230;300" dur="16s" repeatCount="indefinite"/></circle>

  <text x="60" y="78" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#8b98b5">// hello, world</text>
  <text x="60" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Aarish Sharma</text>
  
  <text x="60" y="188" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" fill="#e6edf3" opacity="1"><tspan fill="#38bdf8">&gt; </tspan>Java full-stack developer
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2125;0.2375;1" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="60" y="188" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" fill="#e6edf3" opacity="0"><tspan fill="#38bdf8">&gt; </tspan>Learning DevOps, one pipeline at a time
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2750;0.4625;0.4875;1" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="60" y="188" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" fill="#e6edf3" opacity="0"><tspan fill="#38bdf8">&gt; </tspan>Solving DSA problems in C++
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5250;0.7125;0.7375;1" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="60" y="188" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" fill="#e6edf3" opacity="0"><tspan fill="#38bdf8">&gt; </tspan>Shipping code, one commit at a time
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7750;0.9625;0.9875;1" dur="16.0s" repeatCount="indefinite"/></text>

  <line x1="60" y1="262" x2="940" y2="262" stroke="#8b98b5" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="60" y1="262" x2="940" y2="262" stroke="url(#rail)" stroke-width="2" stroke-dasharray="880" stroke-dashoffset="880">
    <animate attributeName="stroke-dashoffset" values="880;0;0;880" keyTimes="0;0.8;0.95;1" dur="5s" repeatCount="indefinite"/></line>
  
  <circle cx="60" cy="262" r="9" fill="#0b1020" stroke="#8b98b5" stroke-width="2"/>
  <circle cx="60" cy="262" r="9" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.060;0.240;0.300;1" dur="5s" repeatCount="indefinite"/></circle>
  <text x="60" y="296" text-anchor="start" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b98b5">commit</text>
  <circle cx="280" cy="262" r="9" fill="#0b1020" stroke="#8b98b5" stroke-width="2"/>
  <circle cx="280" cy="262" r="9" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.200;0.260;0.440;0.500;1" dur="5s" repeatCount="indefinite"/></circle>
  <text x="280" y="296" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b98b5">build</text>
  <circle cx="500" cy="262" r="9" fill="#0b1020" stroke="#8b98b5" stroke-width="2"/>
  <circle cx="500" cy="262" r="9" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.460;0.640;0.700;1" dur="5s" repeatCount="indefinite"/></circle>
  <text x="500" y="296" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b98b5">test</text>
  <circle cx="720" cy="262" r="9" fill="#0b1020" stroke="#8b98b5" stroke-width="2"/>
  <circle cx="720" cy="262" r="9" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.660;0.840;0.900;1" dur="5s" repeatCount="indefinite"/></circle>
  <text x="720" y="296" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b98b5">containerize</text>
  <circle cx="940" cy="262" r="9" fill="#0b1020" stroke="#8b98b5" stroke-width="2"/>
  <circle cx="940" cy="262" r="9" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.800;0.860;1.040;1.100;1" dur="5s" repeatCount="indefinite"/></circle>
  <text x="940" y="296" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b98b5">deploy</text>
  <circle r="6" fill="#38bdf8"><animateMotion dur="5s" repeatCount="indefinite" path="M60,262 L940,262" keyTimes="0;0.8;1" keyPoints="0;1;1" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="5s" repeatCount="indefinite"/></circle>
</g>
<rect x=".5" y=".5" width="999" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>