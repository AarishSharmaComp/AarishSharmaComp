name: Profile assets

# Reusable: called by update-profile.yml. Can also be run by hand from the Actions tab.
# Generates the banner, about card, section headings and footer as SVGs and
# pushes them to the assets-output branch, so no image files are needed in the repo.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  assets:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate SVG assets
        run: |
          python3 - <<'PY'
          import math, os
          OUT = "dist"
          os.makedirs(OUT, exist_ok=True)
          SANS = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          MONO = "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
          INK, PANEL, CYAN, VIOLET, MINT, TEXT, MUTED = "#0b1020", "#111a33", "#38bdf8", "#a78bfa", "#34d399", "#e6edf3", "#8b98b5"

          def w(name, s):
              open(os.path.join(OUT, name), "w", encoding="utf-8").write(s)

          # ---------------- header ----------------
          W, H = 1000, 320
          X0 = 60
          role_svg = f'''
            <text x="60" y="188" font-family="{MONO}" font-size="28" fill="{TEXT}"><tspan fill="{CYAN}">&gt; </tspan>Shipping code, one commit at a time.</text>'''

          nodes = [("commit", 60), ("build", 280), ("test", 500), ("containerize", 720), ("deploy", 940)]
          node_svg = ""
          for i, (lab, x) in enumerate(nodes):
              delay = i * 1.0
              node_svg += f'''
            <circle cx="{x}" cy="262" r="9" fill="{INK}" stroke="{MUTED}" stroke-width="2"/>
            <circle cx="{x}" cy="262" r="9" fill="{MINT}" opacity="0">
              <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;{delay/5:.3f};{(delay+0.3)/5:.3f};{(delay+1.2)/5:.3f};{(delay+1.5)/5:.3f};1" dur="5s" repeatCount="indefinite"/></circle>
            <text x="{x}" y="296" text-anchor="{'start' if i==0 else 'end' if i==4 else 'middle'}" font-family="{MONO}" font-size="13" fill="{MUTED}">{lab}</text>'''

          header = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-label="Aarish Sharma, Java full-stack developer learning DevOps">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131c3a"/></linearGradient>
            <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="460" y2="0" spreadMethod="reflect">
              <stop offset="0" stop-color="{CYAN}"/><stop offset="0.5" stop-color="{VIOLET}"/><stop offset="1" stop-color="{CYAN}"/>
              <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="8s" repeatCount="indefinite"/></linearGradient>
            <radialGradient id="g1"><stop offset="0" stop-color="{CYAN}" stop-opacity=".28"/><stop offset="1" stop-color="{CYAN}" stop-opacity="0"/></radialGradient>
            <radialGradient id="g2"><stop offset="0" stop-color="{VIOLET}" stop-opacity=".30"/><stop offset="1" stop-color="{VIOLET}" stop-opacity="0"/></radialGradient>
            <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
            <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="{CYAN}"/><stop offset="1" stop-color="{VIOLET}"/></linearGradient>
            <clipPath id="card"><rect width="{W}" height="{H}" rx="18"/></clipPath>
          </defs>
          <g clip-path="url(#card)">
            <rect width="{W}" height="{H}" fill="url(#bg)"/>
            <rect width="{W}" height="{H}" fill="url(#grid)"/>
            <circle r="260" fill="url(#g1)"><animate attributeName="cx" values="820;900;820" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;110;40" dur="14s" repeatCount="indefinite"/></circle>
            <circle r="240" fill="url(#g2)"><animate attributeName="cx" values="120;40;120" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="300;230;300" dur="16s" repeatCount="indefinite"/></circle>

            <text x="{X0}" y="78" font-family="{MONO}" font-size="16" fill="{MUTED}">// hello, world</text>
            <text x="{X0}" y="142" font-family="{SANS}" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Aarish Sharma</text>
            {role_svg}

            <line x1="60" y1="262" x2="940" y2="262" stroke="{MUTED}" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 6"/>
            <line x1="60" y1="262" x2="940" y2="262" stroke="url(#rail)" stroke-width="2" stroke-dasharray="880" stroke-dashoffset="880">
              <animate attributeName="stroke-dashoffset" values="880;0;0;880" keyTimes="0;0.8;0.95;1" dur="5s" repeatCount="indefinite"/></line>
            {node_svg}
            <circle r="6" fill="{CYAN}"><animateMotion dur="5s" repeatCount="indefinite" path="M60,262 L940,262" keyTimes="0;0.8;1" keyPoints="0;1;1" calcMode="linear"/>
              <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="5s" repeatCount="indefinite"/></circle>
          </g>
          <rect x=".5" y=".5" width="{W-1}" height="{H-1}" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
          </svg>'''
          w("header.svg", header)

          # ---------------- about terminal ----------------
          lines = [
            (f'<tspan fill="{MINT}">aarish@github</tspan><tspan fill="{MUTED}">:</tspan><tspan fill="{CYAN}">~</tspan><tspan fill="{MUTED}">$ </tspan><tspan fill="{TEXT}">cat about.json</tspan>', 0.3),
            (f'<tspan fill="{MUTED}">{{</tspan>', 1.3),
            (f'  <tspan fill="{VIOLET}">"name"</tspan><tspan fill="{MUTED}">: </tspan><tspan fill="#a5d6a7">"Aarish Sharma"</tspan><tspan fill="{MUTED}">,</tspan>', 1.6),
            (f'  <tspan fill="{VIOLET}">"role"</tspan><tspan fill="{MUTED}">: </tspan><tspan fill="#a5d6a7">"Student developer"</tspan><tspan fill="{MUTED}">,</tspan>', 1.9),
            (f'  <tspan fill="{VIOLET}">"building"</tspan><tspan fill="{MUTED}">: [</tspan><tspan fill="#a5d6a7">"Spring"</tspan><tspan fill="{MUTED}">, </tspan><tspan fill="#a5d6a7">"React"</tspan><tspan fill="{MUTED}">, </tspan><tspan fill="#a5d6a7">"Next.js"</tspan><tspan fill="{MUTED}">],</tspan>', 2.2),
            (f'  <tspan fill="{VIOLET}">"learning"</tspan><tspan fill="{MUTED}">: [</tspan><tspan fill="#a5d6a7">"Docker"</tspan><tspan fill="{MUTED}">, </tspan><tspan fill="#a5d6a7">"Kubernetes"</tspan><tspan fill="{MUTED}">, </tspan><tspan fill="#a5d6a7">"Terraform"</tspan><tspan fill="{MUTED}">, </tspan><tspan fill="#a5d6a7">"AWS"</tspan><tspan fill="{MUTED}">],</tspan>', 2.5),
            (f'  <tspan fill="{VIOLET}">"practising"</tspan><tspan fill="{MUTED}">: </tspan><tspan fill="#a5d6a7">"DSA in C++ on LeetCode"</tspan><tspan fill="{MUTED}">,</tspan>', 2.8),
            (f'  <tspan fill="{VIOLET}">"goal"</tspan><tspan fill="{MUTED}">: </tspan><tspan fill="#a5d6a7">"Full-stack to DevOps"</tspan>', 3.1),
            (f'<tspan fill="{MUTED}">}}</tspan>', 3.4),
          ]
          y0, lh = 100, 28
          body = ""
          for i, (ln, t) in enumerate(lines):
              body += f'<text xml:space="preserve" x="40" y="{y0 + i*lh}" font-family="{MONO}" font-size="17" opacity="0">{ln}<animate attributeName="opacity" from="0" to="1" begin="{t}s" dur="0.25s" fill="freeze"/></text>\n  '
          Hh = y0 + len(lines) * lh + 20
          about = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="{Hh}" viewBox="0 0 1000 {Hh}" role="img" aria-label="About Aarish: student developer, Java full-stack, learning DevOps">
          <defs><clipPath id="c"><rect width="1000" height="{Hh}" rx="14"/></clipPath></defs>
          <g clip-path="url(#c)">
            <rect width="1000" height="{Hh}" fill="{INK}"/>
            <rect width="1000" height="48" fill="{PANEL}"/>
            <circle cx="28" cy="24" r="7" fill="#ff5f57"/><circle cx="52" cy="24" r="7" fill="#febc2e"/><circle cx="76" cy="24" r="7" fill="#28c840"/>
            <text x="500" y="29" text-anchor="middle" font-family="{MONO}" font-size="14" fill="{MUTED}">~/about</text>
            {body}
            <rect x="40" y="{y0 + len(lines)*lh - 18}" width="10" height="20" fill="{CYAN}" opacity="0">
              <animate attributeName="opacity" values="0;1;0" dur="1s" begin="3.8s" repeatCount="indefinite"/></rect>
          </g>
          <rect x=".5" y=".5" width="999" height="{Hh-1}" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
          </svg>'''
          w("about.svg", about)

          # ---------------- section headings ----------------
          def heading(fname, title, sub):
              s = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="{title}">
          <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{CYAN}"/><stop offset="1" stop-color="{VIOLET}"/></linearGradient>
          <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="{CYAN}" stop-opacity=".9"/><stop offset="1" stop-color="{VIOLET}" stop-opacity="0"/></linearGradient></defs>
          <rect x="0" y="14" width="6" height="36" rx="3" fill="url(#a)"/>
          <text x="22" y="38" font-family="{SANS}" font-size="28" font-weight="700" fill="{TEXT}">{title}</text>
          <rect x="0" y="61" width="1000" height="2" rx="1" fill="url(#l)" opacity=".7">
            <animate attributeName="width" from="0" to="1000" dur="1.4s" fill="freeze"/></rect>
          </svg>'''
              w(fname, s)
          heading("h-about.svg", "About me", "")
          heading("h-stack.svg", "Tech stack", "")
          heading("h-stats.svg", "GitHub stats", "")
          heading("h-activity.svg", "Contribution game", "")

          # ---------------- footer wave ----------------
          def wave(amp, period, y, phase=0, n=6):
              d = f"M{-period*phase},{y} "
              x = -period*phase
              for k in range(n):
                  d += f"Q{x+period/4},{y-amp} {x+period/2},{y} T{x+period},{y} "
                  x += period
              d += f"V160 H{-period*phase} Z"
              return d
          P = 500
          footer = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Thanks for stopping by">
          <defs><linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="{CYAN}"/><stop offset="1" stop-color="{VIOLET}"/></linearGradient></defs>
          <g opacity=".25"><path d="{wave(14, P, 92)}" fill="url(#f)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-{P}  0" dur="9s" repeatCount="indefinite"/></path></g>
          <g opacity=".45"><path d="{wave(10, P, 108, 0.3)}" fill="url(#f)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-{P} 0" dur="6s" repeatCount="indefinite"/></path></g>
          <g><path d="{wave(8, P, 126, 0.6)}" fill="url(#f)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-{P} 0" dur="4s" repeatCount="indefinite"/></path></g>
          <text x="500" y="72" text-anchor="middle" font-family="{MONO}" font-size="15" fill="{MUTED}">thanks for stopping by. say hi, open an issue, or fork something.</text>
          </svg>'''
          w("footer.svg", footer)

          # ---------------- tech stack grid (icons embedded so the SVG is self-contained) ----------------
          import base64, urllib.request
          SI = "https://raw.githubusercontent.com/tandpfun/skill-icons/main/icons/%s.svg"
          DV = "https://raw.githubusercontent.com/devicons/devicon/master/icons/%s.svg"
          # (label, skill-icons name or None, devicon path fallback, light tile for dark icons)
          STACK = [
           ("Languages", [("C++","CPP"),("Java","Java-Dark"),("Python","Python-Dark"),("JavaScript","JavaScript"),("TypeScript","TypeScript")]),
           ("Backend & databases", [("Spring","Spring-Dark"),("Node.js","NodeJS-Dark"),("Django","Django"),("FastAPI","FastAPI"),("Tomcat",None,"tomcat/tomcat-original"),("PostgreSQL","PostgreSQL-Dark")]),
           ("Frontend", [("HTML5","HTML"),("CSS3","CSS"),("React","React-Dark"),("Next.js","NextJS-Dark"),("Angular","Angular-Dark"),("Tailwind CSS","TailwindCSS-Dark")]),
           ("Data & ML", [("NumPy",None,"numpy/numpy-original"),("pandas",None,"pandas/pandas-original",True),("TensorFlow","TensorFlow-Dark"),("OpenCV","OpenCV-Dark"),("Kaggle",None,"kaggle/kaggle-original")]),
           ("DevOps & cloud", [("Docker","Docker"),("Kubernetes","Kubernetes"),("Terraform","Terraform-Dark"),("AWS","AWS-Dark"),("Nginx","Nginx")]),
           ("Tools", [("Git","Git"),("IntelliJ IDEA","Idea-Dark"),("JetBrains",None,"jetbrains/jetbrains-original"),("pytest",None,"pytest/pytest-original"),("Figma","Figma-Dark")]),
          ]
          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "profile-readme-builder"})
                  return urllib.request.urlopen(req, timeout=20).read()
              except Exception as e:
                  print("icon fetch failed:", url, e)
                  return None
          def esc(t): return t.replace("&", "&amp;")

          CW, GAP, ICON, ISP, PAD, CH_ = 320, 20, 40, 8, 20, 120
          ts = ""
          for idx, (label, items) in enumerate(STACK):
              cx = (idx % 3) * (CW + GAP); cy = (idx // 3) * (CH_ + GAP)
              ts += f'<g transform="translate({cx},{cy})">\n'
              ts += f'  <rect width="{CW}" height="{CH_}" rx="14" fill="{PANEL}" stroke="#ffffff" stroke-opacity=".08"/>\n'
              ts += f'  <text x="{PAD}" y="{PAD+16}" font-family="{SANS}" font-size="17" font-weight="700" fill="{TEXT}">{esc(label)}</text>\n'
              for j, it in enumerate(items):
                  name, si, dv, light = (list(it) + [None, None, False])[:4] if len(it) < 4 else it
                  x = PAD + j * (ICON + ISP); y = PAD + 40
                  data = fetch(SI % si) if si else None
                  tile = None
                  if data is None and dv:
                      data = fetch(DV % dv); tile = "#e6edf3" if light else "#1f2740"
                  if data is None:
                      ts += f'  <rect x="{x}" y="{y}" width="{ICON}" height="{ICON}" rx="9" fill="#1f2740"/><text x="{x+ICON/2}" y="{y+25}" text-anchor="middle" font-family="{SANS}" font-size="14" font-weight="700" fill="{TEXT}">{esc(name[:2])}</text>\n'
                      continue
                  b64 = base64.b64encode(data).decode()
                  if tile:
                      ts += f'  <rect x="{x}" y="{y}" width="{ICON}" height="{ICON}" rx="9" fill="{tile}"/>\n'
                      ts += f'  <image x="{x+7}" y="{y+7}" width="{ICON-14}" height="{ICON-14}" href="data:image/svg+xml;base64,{b64}"><title>{esc(name)}</title></image>\n'
                  else:
                      ts += f'  <image x="{x}" y="{y}" width="{ICON}" height="{ICON}" href="data:image/svg+xml;base64,{b64}"><title>{esc(name)}</title></image>\n'
              ts += '</g>\n'
          TH = 2 * CH_ + GAP
          w("tech-stack.svg", f'''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="{TH}" viewBox="0 0 1000 {TH}" role="img" aria-label="Tech stack: languages, backend, frontend, data and ML, DevOps and cloud, tools">
          {ts}</svg>''')

          print(os.listdir(OUT))
          PY

      - name: check SVGs are valid
        run: |
          python3 - <<'PY'
          import glob, xml.dom.minidom as md
          files = sorted(glob.glob("dist/*.svg"))
          assert len(files) == 8, f"expected 8 SVGs, found {len(files)}"
          for f in files:
              md.parse(f)
          print("OK:", [f.split("/")[-1] for f in files])
          PY

      - name: push SVGs to the assets-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: assets-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
