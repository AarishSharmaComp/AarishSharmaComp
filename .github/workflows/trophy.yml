name: Trophy card

# Reusable: called by update-profile.yml. Can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  trophy:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          theme: darkhub
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: false

      - name: push trophy.svg to the trophy-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
